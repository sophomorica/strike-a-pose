name: strike_a_pose
description: Strike a Pose v1. One iPhone, passed around the room.
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.6.0
  camera: ^0.11.2
  google_mlkit_pose_detection: ^0.14.0
  image: ^4.5.4
  path_provider: ^2.1.5
  wakelock_plus: ^1.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sfx/
    - assets/fonts/
  fonts:
    - family: Barlow Condensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/BarlowCondensed-Black.ttf
          weight: 900
    - family: Baloo 2
      fonts:
        - asset: assets/fonts/Baloo2.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
    - family: Permanent Marker
      fonts:
        - asset: assets/fonts/PermanentMarker-Regular.ttf
